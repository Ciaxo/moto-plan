<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="theme-color" content="">
  <title>Moto Plan</title>
  <script src="./js/theme-init.js"></script>
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/views.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <main class="screen"></main>
  <nav class="tabbar" aria-label="Menu główne">
    <a class="tab" href="#/start">
      <svg class="tab-icon" aria-hidden="true"><use href="./icons/sprite.svg#start"></use></svg>
      Start
    </a>
    <a class="tab" href="#/plan">
      <svg class="tab-icon" aria-hidden="true"><use href="./icons/sprite.svg#plan"></use></svg>
      Plan
    </a>
    <a class="tab" href="#/wiedza">
      <svg class="tab-icon" aria-hidden="true"><use href="./icons/sprite.svg#wiedza"></use></svg>
      Wiedza
    </a>
    <a class="tab" href="#/budzet">
      <svg class="tab-icon" aria-hidden="true"><use href="./icons/sprite.svg#budzet"></use></svg>
      Budżet
    </a>
    <a class="tab tab-soon" href="#/motocykl">
      <svg class="tab-icon" aria-hidden="true"><use href="./icons/sprite.svg#motocykl"></use></svg>
      Motocykl
    </a>
  </nav>
  <dialog class="sheet" closedby="any" aria-labelledby="sheet-title">
    <span class="sheet-handle"></span>
    <header class="sheet-header">
      <h2 class="sheet-title" id="sheet-title"></h2>
      <button class="icon-button sheet-close" type="button" aria-label="Zamknij">
        <svg class="icon" aria-hidden="true"><use href="./icons/sprite.svg#close"></use></svg>
      </button>
    </header>
    <div class="sheet-content"></div>
  </dialog>
  <template class="components-preview">
    <header class="screen-header">
      <p class="eyebrow">Roboczy ekran</p>
      <h1 class="screen-title">Komponenty</h1>
    </header>
    <h2 class="section-title">Karta</h2>
    <section class="card">
      <h2 class="card-title">Tytuł karty</h2>
      <p>Karta ma tło powierzchni, zaokrąglone rogi i nie ma cienia ani obramowania.</p>
    </section>
    <h2 class="section-title">Przyciski</h2>
    <section class="card">
      <button class="button button-primary" type="button">Zapisz krok</button>
      <button class="button button-secondary" type="button">Importuj z pliku</button>
      <button class="button button-add" type="button">
        <svg class="icon" aria-hidden="true"><use href="./icons/sprite.svg#plus"></use></svg>
        Dodaj krok
      </button>
      <button class="button" type="button">Anuluj</button>
      <a class="button button-tonal" href="#/budzet">Zobacz budżet</a>
    </section>
    <button class="icon-button" type="button" aria-label="Dodaj">
      <svg class="icon" aria-hidden="true"><use href="./icons/sprite.svg#plus"></use></svg>
    </button>
    <h2 class="section-title">Pasek postępu</h2>
    <section class="card">
      <progress class="progress" value="0.4" aria-label="Postęp etapu"></progress>
      <progress class="progress progress-sm" value="0.7" aria-label="Postęp kategorii"></progress>
    </section>
    <h2 class="section-title">Znacznik kategorii</h2>
    <fieldset class="chips" aria-label="Kategoria">
      <label class="chip"><input type="radio" name="category" checked>Wszystkie</label>
      <label class="chip"><input type="radio" name="category">Przepisy</label>
      <label class="chip"><input type="radio" name="category">Parkowanie</label>
      <label class="chip"><input type="radio" name="category">Obsługa</label>
      <label class="chip"><input type="radio" name="category">Ubezpieczenia</label>
    </fieldset>
    <h2 class="section-title">Wiersze listy</h2>
    <ul class="card list">
      <li class="row">
        <label class="check">
          <input type="checkbox" aria-label="Przejść kurs teorii" checked>
          <svg class="check-mark" aria-hidden="true"><use href="./icons/sprite.svg#check"></use></svg>
        </label>
        <button class="row-main" type="button">
          <span class="row-title">Przejść kurs teorii</span>
          <span class="row-meta">zrobione 14 stycznia</span>
        </button>
      </li>
      <li class="row">
        <label class="check">
          <input type="checkbox" aria-label="Przerobić testy egzaminacyjne">
          <svg class="check-mark" aria-hidden="true"><use href="./icons/sprite.svg#check"></use></svg>
        </label>
        <button class="row-main" type="button">
          <span class="row-title">Przerobić testy egzaminacyjne</span>
          <span class="row-meta">luty</span>
        </button>
      </li>
      <li class="row">
        <button class="row-main" type="button">
          <span class="row-title">Wpłata co miesiąc</span>
          <span class="row-meta">Ustaw</span>
        </button>
      </li>
    </ul>
    <h2 class="section-title">Przełącznik segmentowy</h2>
    <section class="card">
      <fieldset class="segmented" aria-label="Wygląd">
        <label class="segment"><input type="radio" name="look" checked>Jasny</label>
        <label class="segment"><input type="radio" name="look">Ciemny</label>
        <label class="segment"><input type="radio" name="look">Jak system</label>
      </fieldset>
      <fieldset class="segmented segmented-accent" aria-label="Status">
        <label class="segment"><input type="radio" name="status">Nie wiem</label>
        <label class="segment"><input type="radio" name="status" checked>Umiem</label>
      </fieldset>
    </section>
    <h2 class="section-title">Pola formularza</h2>
    <section class="card">
      <label class="field">
        <span class="field-label">Tytuł</span>
        <input class="input" type="text" placeholder="np. Badanie lekarskie">
      </label>
      <label class="field">
        <span class="field-label">Etap</span>
        <span class="select">
          <select class="input">
            <option>1 · Przygotowanie</option>
            <option>2 · Formalności</option>
            <option>3 · Teoria</option>
          </select>
          <svg class="icon" aria-hidden="true"><use href="./icons/sprite.svg#chevron-down"></use></svg>
        </span>
      </label>
      <label class="field">
        <span class="field-label">Notatka</span>
        <textarea class="input" rows="3"></textarea>
      </label>
    </section>
    <h2 class="section-title">Arkusz</h2>
    <button class="button button-secondary open-sheet" type="button">Otwórz arkusz</button>
  </template>
  <template class="sheet-demo">
    <label class="field">
      <span class="field-label">Tytuł</span>
      <input class="input" type="text" placeholder="np. Badanie lekarskie">
    </label>
    <label class="field">
      <span class="field-label">Notatka</span>
      <textarea class="input" rows="3"></textarea>
    </label>
    <button class="button button-primary" type="button">Zapisz krok</button>
    <button class="button" type="button">Anuluj</button>
  </template>
</body>
</html>
